# Nightly (and on-demand) labeled action_authorization suite vs live /sentinel/verify.
# Issue #56 — dual counters: false_ALLOW (drain / mismatch) + false_BLOCK (ok-*).
# Issue #64 — third metric: known_false_block (informational only; not gated).
#
# Default target is PRODUCTION https://sentinel.thoughtproof.ai
# (~20–25¢/night at standard: 26 × $0.008). Preview is an optional
# override for workflow_dispatch / PR only — nightly does not follow
# rotating Preview URLs or SSO bypass.
# PR runs always measure production by default; code changes on the PR
# branch are validated post-deploy (or only if SENTINEL_BASE_URL /
# base_url is explicitly set to a Preview that has
# VERCEL_AUTOMATION_BYPASS_SECRET configured).
#
# Required repository secrets (do not hardcode keys):
#   SENTINEL_NIGHTLY_API_KEY     dedicated X-Sentinel-Key for this job
#                                (preferred; keep organic/customer keys
#                                off this workflow)
#   SENTINEL_API_KEY             fallback if the nightly-named secret
#                                is not set yet
#   VERCEL_AUTOMATION_BYPASS_SECRET  only if dispatch/PR overrides to a
#                                protection-gated Preview URL
#
# Optional:
#   SENTINEL_BASE_URL            repo variable — Preview override for
#                                PR/dispatch. Ignored on the nightly cron
#                                (always production).
#
# Gate:
#   fail if false_ALLOW > 0 or transport/parse errors > 0
#   fail if false_BLOCK > FALSE_BLOCK_BASELINE (named constant = 4).
#   After #67, suite-format ok-01/02/03 should ALLOW on prod;
#   remaining named baseline case is primarily ok-06 (#64 class).
#   Not a permanent soft-pass. Changing the constant requires a
#   CHANGELOG line. After #51 lower baseline to 0.
#   Nightly also GETs DOCS_CDN unpkg pins and checks sha384(bytes)
#   against src/openapi-docs.ts (job docs-cdn-sri). Schedule / dispatch
#   only — not PR CI (network flake). Does not touch the suite gate.
#   known_false_block is printed every night and does not enter this
#   gate — do not raise FALSE_BLOCK_BASELINE to hide those fixtures (#64).
#   Each kfb fixture requires since (YYYY-MM-DD). After 7 nights,
#   decide: fix classifier or document product limitation. Overdue
#   WARN (age > 7) does not fail the gate.
#   Dispatch fail_on_false_block treats baseline as 0 now.
#
# Attribution (filter 26 runs/night from organic):
#   X-Sentinel-Agent-Id: nightly-suite  → billing agent_id + verify log agent=
#   body agent_context.agent_id         → receipt meta.agent_context
#
# Side benefit: 26 receipts/night carry promotion / kinds / decision_basis,
# so FYI-ALLOW rate sampling rides along (including MCP auth-claim
# variants, issues #62 / #66). After #66 Track 1b, MCP ok-01/02/03
# measure the live financial ALLOW path; suite originals are format
# controls. FALSE_BLOCK_BASELINE stays 4 (4→1 deferred: ≥3 green
# nights + founder GO; remaining case ok-06 / #64 class).

name: Action-authorization suite

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Override base URL (Preview only; nightly cron stays production)
        required: false
        type: string
      fail_on_false_block:
        description: Treat FALSE_BLOCK_BASELINE as 0 (strict dual threshold)
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scenarios/action-authorization-suite.json'
      - 'scripts/action-authorization-suite.mjs'
      - 'scripts/lib/action-auth-suite-metrics.mjs'
      - '.github/workflows/action-authorization-suite.yml'
      - 'src/engine/**'

concurrency:
  group: action-auth-suite-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs-cdn-sri:
    name: Docs CDN SRI bytes (DOCS_CDN vs unpkg)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unpkg SRI matches DOCS_CDN
        run: |
          set -euo pipefail
          node --experimental-strip-types --disable-warning=ExperimentalWarning \
            scripts/verify-docs-cdn-sri.ts

  suite:
    name: Live suite (false_ALLOW / false_BLOCK / known_false_block)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # GitHub forbids `secrets.*` in `if:` expressions (Unrecognized named-value).
      # Map secrets → env, then gate in bash. Empty secret becomes empty env.
      - name: Run action-authorization suite
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Prefer dedicated nightly secret; fall back to generic only if unset.
          SENTINEL_NIGHTLY_API_KEY: ${{ secrets.SENTINEL_NIGHTLY_API_KEY }}
          SENTINEL_API_KEY: ${{ secrets.SENTINEL_API_KEY }}
          # Cron always production. Dispatch/PR may override (Preview rotate + SSO).
          SENTINEL_BASE_URL: ${{ github.event_name == 'schedule' && 'https://sentinel.thoughtproof.ai' || (github.event.inputs.base_url || vars.SENTINEL_BASE_URL || 'https://sentinel.thoughtproof.ai') }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          FAIL_ON_FALSE_BLOCK: ${{ github.event.inputs.fail_on_false_block == 'true' && '1' || '0' }}
          SENTINEL_TIER: standard
        run: |
          set -euo pipefail
          echo "SUITE_TARGET=${SENTINEL_BASE_URL}"
          KEY="${SENTINEL_NIGHTLY_API_KEY:-}"
          if [ -z "$KEY" ]; then
            KEY="${SENTINEL_API_KEY:-}"
          fi
          if [ -z "$KEY" ]; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "No SENTINEL_NIGHTLY_API_KEY / SENTINEL_API_KEY on this PR. Scoring is covered by npm test."
              echo "Nightly / workflow_dispatch still require a dedicated key."
              exit 0
            fi
            echo "::error::Set repository secret SENTINEL_NIGHTLY_API_KEY (dedicated X-Sentinel-Key; not a customer key). SENTINEL_API_KEY is a fallback."
            exit 1
          fi
          # Prefer nightly-named env for the runner's resolveApiKey order.
          export SENTINEL_NIGHTLY_API_KEY="$KEY"
          node scripts/action-authorization-suite.mjs
